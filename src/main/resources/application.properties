server.port=${PORT:8080}

# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =====================================================
# FILE UPLOAD
# =====================================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =====================================================
# ADMIN
# =====================================================

app.admin.password=${ADMIN_PASSWORD:admin123}

# =====================================================
# CORS
# =====================================================

app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}